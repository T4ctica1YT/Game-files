// Main-game default configuration
// Generic/default bindings and cvars; runtime video resolution is kept in config.cfg.

unaliasall

alias "zoom_in" "sensitivity 2;fov 90;wait;fov 70;wait;fov 50;wait;fov 30;wait;fov 10;wait;fov 5;bind F11 zoom_out"
alias "zoom_out" "sensitivity 4;fov 5;wait;fov 10;wait;fov 30;wait;fov 50;wait;fov 70;wait;fov 90;bind F11 zoom_in; sensitivity 3"

unbindall
bind "TAB" "+showscores"
bind "ESCAPE" "togglemenu"
bind "SPACE" "+jump"
bind "ENTER" "+jump"
bind "+" "sizeup"
bind "=" "sizeup"
bind "-" "sizedown"
bind "," "+moveleft"
bind "." "+moveright"
bind "0" "impulse 0"
bind "1" "impulse 1"
bind "2" "impulse 2"
bind "3" "impulse 3"
bind "4" "impulse 4"
bind "5" "impulse 5"
bind "6" "impulse 6"
bind "7" "impulse 7"
bind "8" "impulse 8"
bind "\" "+mlook"
bind "`" "toggleconsole"
bind "~" "toggleconsole"

// WASD movement (authoritative)
bind "w" "+forward"
bind "a" "+moveleft"
bind "s" "+back"
bind "d" "+moveright"
bind "c" "+movedown"
bind "UPARROW" "+forward"
bind "DOWNARROW" "+back"
bind "LEFTARROW" "+left"
bind "RIGHTARROW" "+right"
bind "ALT" "+strafe"
bind "CTRL" "+attack"
bind "SHIFT" "+speed"

// Mouse / view
bind "MOUSE1" "+attack"
bind "MOUSE2" "+jump"
bind "MWHEELUP" "impulse 10"
bind "MWHEELDOWN" "impulse 12"
bind "INS" "+klook"
bind "DEL" "+lookdown"
bind "PGDN" "+lookup"
bind "END" "centerview"

// Menus / utility
bind "F1" "help"
bind "F2" "menu_save"
bind "F3" "menu_load"
bind "F4" "menu_options"
bind "F5" "menu_multiplayer"
bind "F6" "echo Quicksaving...; wait; save quick"
bind "F9" "echo Quickloading...; wait; load quick"
bind "F10" "quit"
bind "F11" "zoom_in"
bind "F12" "screenshot"
bind "PAUSE" "pause"

// Chat
bind "t" "messagemode"
bind "RTHUMB" "messagemode"

// Modern controller bindings from the expansion config
bind "LSHOULDER" "impulse 12"
bind "RSHOULDER" "impulse 10"
bind "ABUTTON" "+jump"
bind "RTRIGGER" "+attack"
bind "XBUTTON" "use"

